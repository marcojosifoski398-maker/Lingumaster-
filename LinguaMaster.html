<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinguaMaster</title><style>body{font-family:Arial;background:#111;color:#fff;text-align:center;margin:0;padding:20px}.card{background:#222;padding:20px;border-radius:12px;max-width:700px;margin:15px auto}button,input{padding:10px;border-radius:8px;border:none;margin:5px}button{background:#3b82f6;color:#fff}.hidden{display:none}</style></head><body><h1>🌍 LinguaMaster</h1><div id="login" class="card"><input id="user" placeholder="Benutzername"><button onclick="login()">Login</button></div><div id="app" class="hidden"><div class="card"><h2 id="welcome"></h2><p>XP: <span id="xp">0</span> | Level: <span id="level">1</span></p></div><div class="card"><h2 id="word">Hallo</h2><button onclick="showJp()">Japanisch</button><button onclick="showSr()">Serbisch</button><p id="trans"></p><button onclick="nextWord()">Nächstes Wort</button></div></div><script>const words=[{german:'Hallo',japanese:'こんにちは',serbian:'Zdravo'},{german:'Danke',japanese:'ありがとう',serbian:'Hvala'},{german:'Pferd',japanese:'馬',serbian:'Konj'},{german:'Wasser',japanese:'水',serbian:'Voda'}];let i=0,xp=0;function login(){let u=document.getElementById('user').value||'Gast';document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('welcome').innerText='Willkommen '+u;}function showJp(){trans.innerText=words[i].japanese;}function showSr(){trans.innerText=words[i].serbian;}function nextWord(){i=(i+1)%words.length;word.innerText=words[i].german;trans.innerText='';xp+=10;document.getElementById('xp').innerText=xp;document.getElementById('level').innerText=Math.floor(xp/100)+1;}</script></body></html>
